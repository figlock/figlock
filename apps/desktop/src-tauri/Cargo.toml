[package]
name = "figlock-desktop"
description = "FigLock desktop app: the Tauri 2 shell around the Svelte UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
figlock-core = { version = "0.2.0", path = "../../../crates/figlock-core" }
figlock-session = { version = "0.2.0", path = "../../../crates/figlock-session" }
figlock-store = { version = "0.2.0", path = "../../../crates/figlock-store" }
getrandom.workspace = true
hex.workspace = true
ureq.workspace = true
zeroize.workspace = true
serde = { version = "1", features = ["derive"] }
# `generate_context!` expands to `serde_json` code once the config has a `plugins` entry (the update key and feed).
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
