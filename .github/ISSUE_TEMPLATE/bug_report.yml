name: Bug report
description: Something does not work as expected
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here; see SECURITY.md. Never paste real secrets or vault contents.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: figlock 0.2.0, macOS 15
