name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      vectors: ${{ steps.filter.outputs.vectors }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'mise.toml'
              - 'justfile'
              - '.github/workflows/ci.yml'
            vectors:
              - 'docs/spec/**'
              - 'justfile'
              - '.github/workflows/ci.yml'
            release:
              - 'scripts/**'
              - '.github/workflows/release*.yml'
              - 'apps/desktop/src-tauri/tauri.bundle.conf.json'
              - 'packaging/**'
              - 'justfile'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/**'
              - 'packages/**'
              - 'site/**'
              - 'design/**'
              - 'relay/**'
              - 'package.json'
              - 'pnpm-*.yaml'
              - 'mise.toml'
              - 'justfile'
              - '.github/workflows/ci.yml'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the Tauri desktop app
        # A mirror that does not resolve must fail in minutes, not stall the job for a quarter of an hour.
        timeout-minutes: 10
        run: |
          # The runner's own resolver (Azure, 168.63.129.16) can fail to resolve the Ubuntu mirrors while
          # everything else resolves. Public resolvers answer them, so switch only when that happens.
          if ! getent hosts archive.ubuntu.com > /dev/null; then
            echo "archive.ubuntu.com does not resolve; switching this runner to public DNS"
            iface=$(ip route show default | awk '{print $5; exit}')
            sudo resolvectl dns "$iface" 8.8.8.8 1.1.1.1
            sudo resolvectl domain "$iface" '~.'
            sudo resolvectl flush-caches
          fi
          apt=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt[@]}" install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Format and clippy
        run: just lint
      - name: Test
        run: just test
      - name: Supply chain (cargo-deny)
        run: just deny

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Design tokens meet WCAG AA
        run: just design-check
      - name: Install, lint and test
        run: |
          if [ -f pnpm-workspace.yaml ]; then
            pnpm install --frozen-lockfile
            pnpm -r --if-present run lint
            pnpm -r --if-present run test
          else
            echo "No JS workspace yet"
          fi
      - name: Desktop end-to-end and accessibility (Playwright, axe)
        run: |
          pnpm --filter @figlock/desktop exec playwright install --with-deps chromium
          pnpm --filter @figlock/desktop run e2e
      - name: Keep the Playwright traces of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/desktop/test-results/
          if-no-files-found: ignore

  vectors:
    needs: changes
    if: needs.changes.outputs.vectors == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Test vectors have not drifted and all cases verify
        run: just vectors-check

  release-scripts:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install minisign
        timeout-minutes: 10
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends minisign
      - name: Release verification scripts (a good release passes, each broken one fails)
        run: scripts/test-release-scripts.sh

  # Single stable check for the main ruleset: skipped path-filtered jobs count as passing.
  ci:
    if: always()
    needs: [changes, rust, web, vectors, release-scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
