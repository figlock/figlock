[package]
name = "figlock-cli"
description = "The figlock binary, including the broker daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "figlock"
path = "src/main.rs"

[dependencies]
figlock-core = { version = "0.0.0", path = "../figlock-core" }
figlock-store = { version = "0.0.0", path = "../figlock-store", features = ["gdrive"] }
figlock-biometric = { version = "0.0.0", path = "../figlock-biometric" }
clap.workspace = true
rpassword.workspace = true
getrandom.workspace = true
serde_json.workspace = true
hex.workspace = true
zeroize.workspace = true
sha2.workspace = true
subtle.workspace = true
ureq.workspace = true
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true
p256.workspace = true

[lints]
workspace = true
