[package]
name = "figlock-cli"
description = "The figlock binary, including the broker daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "figlock"
path = "src/main.rs"

[dependencies]
figlock-core = { version = "0.5.0", path = "../figlock-core" }
figlock-store = { version = "0.5.0", path = "../figlock-store", features = ["gdrive"] }
figlock-broker = { version = "0.5.0", path = "../figlock-broker" }
figlock-session = { version = "0.5.0", path = "../figlock-session" }
clap.workspace = true
rpassword.workspace = true
getrandom.workspace = true
serde_json.workspace = true
hex.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
