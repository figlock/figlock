[package]
name = "figlock-ffi"
description = "UniFFI exports for Swift and Kotlin (wasm-bindgen exports land with the web app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# The binding generator (`cargo run -p figlock-ffi --features bindgen --bin uniffi-bindgen`). Off for app
# builds so the shipped library does not pull in the generator's dependencies.
bindgen = ["uniffi/cli"]
# The Google Drive adapter, fed its access token by the app (ADR-0041 decision 3).
default = ["gdrive"]
gdrive = ["figlock-store/gdrive"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[test]]
name = "bindings"
required-features = ["bindgen"]

[dependencies]
figlock-core = { path = "../figlock-core" }
figlock-store = { path = "../figlock-store" }
figlock-sync = { path = "../figlock-sync" }
uniffi.workspace = true
zeroize.workspace = true

[dev-dependencies]
p256.workspace = true
tempfile.workspace = true
serde_json.workspace = true
sha1.workspace = true

[lints]
workspace = true
