<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Figlock">
  <title>Figlock</title>
  <!-- Vector redraw of the reference icon: blue squircle, white padlock, small blue "f" on the body -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A90F2"/>
      <stop offset="1" stop-color="#2E47E2"/>
    </linearGradient>
  </defs>
  <rect id="background" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <g id="padlock" fill="#fff">
    <path id="shackle" d="M328 460 V329 a179 179 0 0 1 358 0 V460" fill="none" stroke="#fff" stroke-width="84"/>
    <rect id="body" x="210" y="440" width="598" height="466" rx="64"/>
  </g>
  <g id="letter-f" transform="translate(506 806) scale(0.8) translate(-506 -806)" fill="none" stroke="#3050E4" stroke-linecap="round">
    <path id="stem-hook" d="M506 778 V622 C506 584 528 562 566 562" stroke-width="56"/>
    <path id="crossbar" d="M460 660 H558" stroke-width="40"/>
  </g>
