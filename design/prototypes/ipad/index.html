<meta charset="utf-8">

<title>FigLock for iPad - interactive prototype</title>
<style>
/* FigLock design tokens (tokens.css), inlined unchanged */
/*
 * FigLock design tokens (FIG-22). Source of truth for web, desktop and extension (packages/ui).
 * iOS and Android map the same names to SwiftUI and Compose; see design/DESIGN.md.
 * Contrast ratios of every text/background pair are listed in DESIGN.md and meet WCAG 2.2 AA.
 * Never reference the raw palette (--brand-*, --neutral-*) from components; use the semantic tokens.
 */

:root {
  /* ---- Raw palette: brand blue ---- */
  --brand-50: #eef1ff;
  --brand-200: #b8c4ff;
  --brand-300: #9fb0ff;
  --brand-500: #3b5afe;
  --brand-600: #2c46d6;
  --brand-900: #161d4a;

  /* ---- Raw palette: warm neutral ---- */
  --neutral-0: #ffffff;
  --neutral-50: #faf9f9;
  --neutral-100: #f2f0f1;
  --neutral-200: #e5e2e4;
  --neutral-300: #cfcacd;
  --neutral-400: #a29ca0;
  --neutral-500: #78727a;
  --neutral-600: #5a555c;
  --neutral-700: #3f3b41;
  --neutral-800: #2a272c;
  --neutral-900: #1b191d;
  --neutral-950: #121114;

  /* ---- Typography ---- */
  --font-sans: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --text-xs: 0.75rem; /* 12 */
  --text-sm: 0.8125rem; /* 13 */
  --text-base: 0.875rem; /* 14, dense desktop UI default */
  --text-md: 1rem; /* 16, mobile and web body */
  --text-lg: 1.125rem; /* 18 */
  --text-xl: 1.25rem; /* 20 */
  --text-2xl: 1.5rem; /* 24 */
  --text-3xl: 1.875rem; /* 30 */
  --text-4xl: 2.25rem; /* 36 */

  --leading-tight: 1.2;
  --leading-snug: 1.35;
  --leading-normal: 1.5;

  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;

  --tracking-tight: -0.01em;
  --tracking-normal: 0;
  --tracking-wide: 0.04em; /* small caps labels */

  /* ---- Spacing: 4 px grid ---- */
  --space-0: 0;
  --space-1: 0.25rem; /* 4 */
  --space-2: 0.5rem; /* 8 */
  --space-3: 0.75rem; /* 12 */
  --space-4: 1rem; /* 16 */
  --space-5: 1.25rem; /* 20 */
  --space-6: 1.5rem; /* 24 */
  --space-8: 2rem; /* 32 */
  --space-10: 2.5rem; /* 40 */
  --space-12: 3rem; /* 48 */
  --space-16: 4rem; /* 64 */

  /* ---- Radius ---- */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-full: 9999px;

  /* ---- Sizing ---- */
  --control-height-sm: 28px;
  --control-height-md: 36px;
  --control-height-lg: 44px; /* minimum touch target on iOS; Android uses 48 (--touch-target-android) */
  --touch-target-android: 48px;
  --focus-ring-width: 2px;
  --focus-ring-offset: 2px;

  /* ---- Motion ---- */
  --duration-instant: 80ms;
  --duration-fast: 120ms;
  --duration-base: 200ms;
  --duration-slow: 320ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-enter: cubic-bezier(0, 0, 0, 1);
  --ease-exit: cubic-bezier(0.3, 0, 1, 1);

  /* ---- Layering ---- */
  --z-dropdown: 100;
  --z-sticky: 200;
  --z-overlay: 300;
  --z-modal: 400;
  --z-toast: 500;
}

/* ---- Semantic colors: light (default) ---- */
:root,
:root[data-theme="light"] {
  color-scheme: light;

  --color-bg: #faf9f9;
  --color-surface: #ffffff;
  --color-surface-sunken: #f2f0f1;
  --color-surface-raised: #ffffff;

  --color-text: #1b191d;
  --color-text-secondary: #5a555c;
  --color-text-tertiary: #6b656d;
  --color-text-on-primary: #ffffff;
  --color-text-link: #3b5afe;

  --color-border: #e5e2e4;
  --color-border-strong: #8d878f; /* inputs and controls: 3:1 against bg */

  --color-primary: #3b5afe;
  --color-primary-hover: #2c46d6;
  --color-primary-subtle: #eef1ff;

  --color-agent: #0f6e7a; /* everything about an AI agent asking for access */
  --color-agent-subtle: #e6f3f5;

  --color-success: #1e7a4d;
  --color-success-subtle: #e8f5ee;
  --color-warning: #8a5a00;
  --color-warning-subtle: #fbf1dc;
  --color-danger: #b3261e;
  --color-danger-subtle: #fdecea;

  --color-focus: #3b5afe;
  --color-overlay: rgb(27 25 29 / 0.5);

  --shadow-sm: 0 1px 2px rgb(27 25 29 / 0.08);
  --shadow-md: 0 4px 12px rgb(27 25 29 / 0.1);
  --shadow-lg: 0 12px 32px rgb(27 25 29 / 0.16);
}

/* ---- Semantic colors: dark ---- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --color-bg: #121114;
    --color-surface: #1b191d;
    --color-surface-sunken: #0d0c0e;
    --color-surface-raised: #242127;

    --color-text: #f2f0f1;
    --color-text-secondary: #c4bfc3;
    --color-text-tertiary: #a29ca0;
    --color-text-on-primary: #121114;
    --color-text-link: #9fb0ff;

    --color-border: #2a272c;
    --color-border-strong: #6f6972;

    --color-primary: #9fb0ff;
    --color-primary-hover: #b8c4ff;
    --color-primary-subtle: #161d4a;

    --color-agent: #5cc8d6;
    --color-agent-subtle: #0f2b30;

    --color-success: #5cd08f;
    --color-success-subtle: #0f2a1b;
    --color-warning: #e8b04a;
    --color-warning-subtle: #2e2208;
    --color-danger: #ff8a80;
    --color-danger-subtle: #3a1512;

    --color-focus: #9fb0ff;
    --color-overlay: rgb(0 0 0 / 0.6);

    --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.4);
    --shadow-md: 0 4px 12px rgb(0 0 0 / 0.5);
    --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.6);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --color-bg: #121114;
  --color-surface: #1b191d;
  --color-surface-sunken: #0d0c0e;
  --color-surface-raised: #242127;

  --color-text: #f2f0f1;
  --color-text-secondary: #c4bfc3;
  --color-text-tertiary: #a29ca0;
  --color-text-on-primary: #121114;
  --color-text-link: #9fb0ff;

  --color-border: #2a272c;
  --color-border-strong: #6f6972;

  --color-primary: #9fb0ff;
  --color-primary-hover: #b8c4ff;
  --color-primary-subtle: #161d4a;

  --color-agent: #5cc8d6;
  --color-agent-subtle: #0f2b30;

  --color-success: #5cd08f;
  --color-success-subtle: #0f2a1b;
  --color-warning: #e8b04a;
  --color-warning-subtle: #2e2208;
  --color-danger: #ff8a80;
  --color-danger-subtle: #3a1512;

  --color-focus: #9fb0ff;
  --color-overlay: rgb(0 0 0 / 0.6);

  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.4);
  --shadow-md: 0 4px 12px rgb(0 0 0 / 0.5);
  --shadow-lg: 0 12px 32px rgb(0 0 0 / 0.6);
}

/* ---- Reduced motion: keep state changes, drop movement ---- */
@media (prefers-reduced-motion: reduce) {
  :root {
    --duration-instant: 0ms;
    --duration-fast: 0ms;
    --duration-base: 0ms;
    --duration-slow: 0ms;
  }
}

:root {
  --dt: 1;
  --font-ios: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, sans-serif;
  --t-xs: calc(var(--text-xs) * var(--dt));
  --t-sm: calc(var(--text-sm) * var(--dt));
  --t-base: calc(var(--text-base) * var(--dt));
  --t-md: calc(var(--text-md) * var(--dt));
  --t-lg: calc(var(--text-lg) * var(--dt));
  --t-xl: calc(var(--text-xl) * var(--dt));
  --t-2xl: calc(var(--text-2xl) * var(--dt));
  --t-3xl: calc(var(--text-3xl) * min(var(--dt), 1.5));
  --safe-t: 24px;
  --safe-b: 20px;
  --glass: 82%;
  --blur: blur(24px) saturate(1.5);
  --tint: color-mix(in srgb, var(--color-text) 7%, transparent);
  --hair: var(--color-border);
}
@media (prefers-reduced-transparency: reduce) { :root { --glass: 100%; --blur: none; } }
html.rm { --duration-instant: 0ms; --duration-fast: 0ms; --duration-base: 0ms; --duration-slow: 0ms; }
html.rm *, html.rm *::before, html.rm *::after { animation: none !important; transition: none !important; }
[hidden]:not([hidden="until-found" i]) { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; background: var(--color-surface-sunken); color: var(--color-text); font-family: var(--font-ios); font-size: var(--text-base); line-height: var(--leading-snug); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:where(button, input, select, textarea, [tabindex], a):focus-visible { outline: var(--focus-ring-width) solid var(--color-focus); outline-offset: var(--focus-ring-offset); }
.od-icon { display: inline-block; inline-size: var(--od-icon-size, 1em); block-size: var(--od-icon-size, 1em); flex: none; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-variant-ligatures: none; }

/* ---------- prototype toolbar (outside the device) ---------- */
.tb { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-6); align-items: flex-end; padding: var(--space-3) var(--space-4); background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
.tb .g { display: grid; gap: var(--space-1); }
.tb .gl { font-size: var(--text-xs); font-weight: 600; color: var(--color-text-secondary); }
.tb .seg { display: flex; gap: 2px; padding: 2px; border-radius: var(--radius-sm); background: var(--tint); }
.tb .seg button { min-height: 44px; min-width: 44px; padding: 0 var(--space-3); border: 0; border-radius: var(--radius-xs); background: none; font-size: var(--text-sm); font-weight: 500; }
.tb .seg button[aria-pressed="true"] { background: var(--color-surface-raised); font-weight: 600; box-shadow: var(--shadow-sm); }
.tb select { min-height: 44px; min-width: 220px; padding: 0 var(--space-3); border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm); background: var(--color-surface); font-size: var(--text-sm); }
.tb .sw { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; }
.tb .note { margin-left: auto; font-size: var(--text-xs); color: var(--color-text-secondary); align-self: center; }
.stage { flex: 1 1 0; min-height: 0; overflow: auto; display: grid; place-items: center; padding: var(--space-4); }

/* ---------- device ---------- */
.dwrap { position: relative; }
.dev { position: absolute; left: 0; top: 0; transform-origin: top left; padding: 18px; border-radius: 40px; background: var(--neutral-900); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--neutral-0) 14%, transparent), var(--shadow-lg); }
.dev::after { content: ""; position: absolute; width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--neutral-700); }
.dev.land::after { left: 5px; top: 50%; margin-top: -4px; }
.dev.port::after { top: 5px; left: 50%; margin-left: -4px; }
.scr { position: relative; overflow: hidden; border-radius: 22px; background: var(--color-surface-sunken); color: var(--color-text); font-family: var(--font-ios); }
.sbar { position: absolute; z-index: 40; top: 0; left: 0; right: 0; height: var(--safe-t); display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 12px; font-weight: 600; pointer-events: none; color: var(--color-text); }
.sbar .r { display: flex; align-items: center; gap: 6px; }
.home { position: absolute; z-index: 40; bottom: 6px; left: 50%; width: 140px; height: 5px; margin-left: -70px; border-radius: var(--radius-full); background: var(--color-text); opacity: .85; pointer-events: none; }
.win { position: absolute; overflow: hidden; background: var(--color-bg); font-size: var(--t-md); }
.win.float { border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); }
.win.part { border-radius: 16px; }
.other { position: absolute; background: var(--color-surface); border-radius: 16px; overflow: hidden; padding: 56px 20px 20px; display: grid; align-content: start; gap: 14px; }
.other i { display: block; height: 14px; border-radius: var(--radius-xs); background: var(--tint); }
.other i.h { height: 72px; border-radius: var(--radius-md); }
.dim { position: absolute; inset: 0; background: var(--color-overlay); z-index: 4; }
.grabpill { position: absolute; z-index: 30; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: var(--radius-full); background: var(--color-border-strong); }

/* ---------- shared controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-sm); background: var(--color-primary); color: var(--color-text-on-primary); font-size: var(--t-md); font-weight: 600; transition: transform var(--duration-instant) var(--ease-standard), background-color var(--duration-instant); }
.btn:active { transform: scale(.98); background: var(--color-primary-hover); }
.btn.wide { width: 100%; min-height: 50px; border-radius: var(--radius-md); }
.btn.sec { background: var(--color-surface); color: var(--color-text-link); }
.btn.plain { background: none; color: var(--color-text-link); }
.btn.danger { background: var(--color-danger); color: var(--color-text-on-primary); }
.btn.agent { background: var(--color-agent); color: var(--color-text-on-primary); }
.btn.warn { background: var(--color-warning); color: var(--color-text-on-primary); }
.btn.tint { background: var(--color-primary-subtle); color: var(--color-text-link); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); min-width: 44px; min-height: 44px; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-sm); background: none; color: var(--color-text-link); font-size: var(--t-md); }
.ibtn:active { background: var(--tint); }
.ibtn.red { color: var(--color-danger); }
.ibtn.tx { padding: 0 var(--space-3); font-weight: 500; }
.badge { display: inline-flex; align-items: center; gap: var(--space-1); padding: 2px var(--space-2); border-radius: var(--radius-xs); background: var(--color-primary-subtle); color: var(--color-text-link); font-size: var(--t-xs); font-weight: 600; }
.badge.ok { background: var(--color-success-subtle); color: var(--color-success); }
.badge.agent { background: var(--color-agent-subtle); color: var(--color-agent); }
.badge.warn { background: var(--color-warning-subtle); color: var(--color-warning); }
.cap { font-size: var(--t-sm); color: var(--color-text-secondary); }
.lbl { font-size: var(--t-sm); font-weight: 500; color: var(--color-text-secondary); }
.fi { width: 100%; min-height: 44px; padding: 0 var(--space-3); border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm); background: var(--color-surface); font-size: var(--t-md); }
textarea.fi { padding: var(--space-3); min-height: 88px; resize: vertical; }
.seg2 { display: flex; gap: 2px; padding: 2px; border-radius: var(--radius-sm); background: var(--tint); }
.seg2 button { flex: 1; min-height: 44px; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-xs); background: none; font-size: var(--t-base); font-weight: 500; }
.seg2 button[aria-pressed="true"], .seg2 button.on { background: var(--color-surface-raised); font-weight: 600; box-shadow: var(--shadow-sm); }
.sw2 { flex: none; position: relative; width: 51px; height: 31px; padding: 0; border: 0; border-radius: var(--radius-full); background: var(--color-border-strong); }
.sw2::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: var(--radius-full); background: var(--color-surface); box-shadow: var(--shadow-sm); transition: transform var(--duration-base) var(--ease-standard); }
.sw2[aria-checked="true"] { background: var(--color-success); }
.sw2[aria-checked="true"]::after { transform: translateX(20px); }
.swrap { display: inline-flex; align-items: center; min-height: 44px; }
.bar4 { height: 4px; border-radius: var(--radius-full); background: var(--color-border); overflow: hidden; }
.bar4 i { display: block; height: 100%; background: var(--color-primary); transform-origin: left; transition: transform 1s linear; }
.grp { background: var(--color-surface); border-radius: var(--radius-md); overflow: hidden; }
.grp > * + * { position: relative; }
.grp > * + *::before { content: ""; position: absolute; z-index: 1; top: 0; left: var(--space-4); right: 0; height: 1px; background: var(--hair); pointer-events: none; }
.ico { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--radius-sm); background: var(--color-primary-subtle); color: var(--color-primary); }
.ico.agent { background: var(--color-agent-subtle); color: var(--color-agent); }
.ico.lg { width: 56px; height: 56px; border-radius: var(--radius-md); }
.logo { display: block; width: var(--m, 64px); height: var(--m, 64px); flex: none; }
.logo svg { display: block; width: 100%; height: 100%; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.t-large .trunc, .t-ax5 .trunc { white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; }
.err { color: var(--color-danger); font-size: var(--t-sm); }
.notice { display: flex; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--color-primary-subtle); font-size: var(--t-base); line-height: var(--leading-normal); }
.notice.warn { background: var(--color-warning-subtle); }
.notice.agent { background: var(--color-agent-subtle); }

/* ---------- centred column scenes ---------- */
.ctr { position: absolute; inset: 0; overflow-y: auto; padding: calc(var(--safe-t) + var(--space-8)) var(--space-6) calc(var(--safe-b) + var(--space-8)); display: grid; align-content: center; justify-items: center; background: var(--color-bg); }
.col { width: min(540px, 100%); display: grid; gap: var(--space-4); }
.col h1 { margin: 0; font-size: var(--t-3xl); line-height: var(--leading-tight); font-weight: 700; letter-spacing: var(--tracking-tight); overflow-wrap: anywhere; }
.col p { margin: 0; color: var(--color-text-secondary); line-height: var(--leading-normal); }
.choice { display: flex; align-items: center; gap: var(--space-4); width: 100%; min-height: 72px; padding: var(--space-4); border: 0; border-radius: var(--radius-md); background: var(--color-surface); text-align: left; }
.choice .g { flex: 1 1 0; min-width: 0; display: grid; gap: 2px; }
.choice .t { font-weight: 600; }
.bio { display: grid; justify-items: center; gap: var(--space-3); }
.biog { width: 96px; height: 96px; display: grid; place-items: center; border-radius: var(--radius-xl); background: var(--color-primary-subtle); color: var(--color-primary); }

/* ---------- regular split ---------- */
.split { position: absolute; inset: 0; display: grid; padding-top: var(--safe-t); background: var(--color-bg); }
.sb { background: var(--color-surface-sunken); display: grid; grid-template-rows: 1fr auto; min-height: 0; box-shadow: 1px 0 0 var(--hair); }
.sbscroll { overflow-y: auto; padding: var(--space-3) var(--space-3) var(--space-2); }
.sbh { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3) var(--space-3); font-size: var(--t-xl); font-weight: 700; }
.sbs { margin: var(--space-4) 0 var(--space-1); padding: 0 var(--space-3); font-size: var(--t-sm); font-weight: 600; color: var(--color-text-secondary); }
.sbi { display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: 44px; padding: var(--space-2) var(--space-3); border: 0; border-radius: var(--radius-sm); background: none; text-align: left; font-size: var(--t-md); }
.sbi .n { flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
.sbi .c { flex: none; font-size: var(--t-sm); color: var(--color-text-secondary); }
.sbi .od-icon { color: var(--color-primary); }
.sbi[aria-current="page"] { background: var(--color-primary-subtle); font-weight: 600; }
.sbfoot { padding: var(--space-2) var(--space-3) calc(var(--safe-b) + var(--space-2)); box-shadow: 0 -1px 0 var(--hair); }
.lcol { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto auto 1fr; background: var(--color-bg); box-shadow: 1px 0 0 var(--hair); }
.dcol { min-width: 0; min-height: 0; overflow-y: auto; background: var(--color-surface-sunken); }
.tbr { display: flex; align-items: center; gap: var(--space-1); min-height: 52px; padding: 0 var(--space-2) 0 var(--space-3); }
.tbr h2 { flex: 1 1 0; min-width: 0; margin: 0; font-size: var(--t-xl); font-weight: 700; letter-spacing: var(--tracking-tight); overflow-wrap: anywhere; }
.lhead { padding: 0 var(--space-3) var(--space-2); display: grid; gap: var(--space-2); }
.sf { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; padding: 0 var(--space-3); border-radius: var(--radius-md); background: var(--tint); color: var(--color-text-secondary); }
.sf input { flex: 1 1 0; min-width: 0; min-height: 44px; border: 0; background: none; font-size: var(--t-md); color: var(--color-text); }

  if (st.multi === 'split12') { const w = Math.floor((W - 8) / 2); win = { x: 0, y: 0, w, h: H, cls: 'part' }; other = { x: w + 8, y: 0, w: W - w - 8, h: H }; }
  if (st.multi === 'split13') { const w = Math.floor((W - 8) / 3); win = { x: 0, y: 0, w, h: H, cls: 'part' }; other = { x: w + 8, y: 0, w: W - w - 8, h: H }; }
  if (st.multi === 'slide') { win = { x: W - 332, y: 36, w: 320, h: H - 72, cls: 'float' }; other = { x: 0, y: 0, w: W, h: H, dim: true }; }
  const effW = win.w / dt, compact = effW < 560, docked = !compact && effW >= 900;
  return { W, H, dt, land, win, other, compact, docked, effW };
}

function lev(a, b) { const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let p = Array.from({ length: n + 1 }, (_, j) => j); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }
function matchWhy(it, q) {
  const s = q.trim().toLowerCase(); if (!s) return '';
  if (it.name.toLowerCase().includes(s)) return 'name';
  if (it.alias.includes(s)) return `alias "${it.alias}"`;
  if ((it.site || '').includes(s)) return `domain ${it.site}`;
  const tg = it.tags.find((t) => t.includes(s)); if (tg) return `tag "${tg}"`;
  if (s.length >= 3) { const ws = [...it.name.toLowerCase().split(/[^a-z0-9]+/), it.alias, ...(it.site || '').split(/[^a-z0-9]+/)].filter((w) => w.length >= 3); const h = ws.find((w) => lev(s, w) <= (s.length >= 6 ? 2 : 1)); if (h) return `typo-corrected to "${h}"`; }
  return null;
}

}

function applyPreset(id) {

  st.items = seedItems(); st.deleted = seedDeleted(); st.devices = seedDevices(); resetApp(); st.preset = p[0]; p[2](); if (st.sheet || st.pop || st.agent || st.bioP) st.opener = null; render();
}

/* ---------- boot ---------- */
(function boot() {
  const pick = $('#pick'); PRESETS.forEach(([id, l]) => { const o = document.createElement('option'); o.value = id; o.textContent = l; pick.appendChild(o); });
  pick.addEventListener('change', () => applyPreset(pick.value));
  $$('[data-c]').forEach((b) => b.addEventListener('click', () => { st[b.dataset.c] = b.dataset.v; render(); }));
  $('#rmsw').addEventListener('click', () => { st.rm = !st.rm; render(); });
  addEventListener('resize', () => render());
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (st.theme === 'system') render(); });
  applyPreset('vault-sel');
})();

</script>
</body>
</html>
